# The native app: build, test, package, sign.
#
# Extracted from ci.yml so that **the release runs the same job CI does**,
# rather than a second copy of it. That is the same rule the installer
# step already follows -- "an installer that is only ever built for a
# release is one whose first exercise is the release" -- carried one
# level up: a release-only build path would have its first exercise at
# the release too, and it is the path with the signing credentials in it.
#
# It is a reusable workflow rather than a job with more `if`s because a
# release needs exactly two things CI does not: version numbers in the
# package names, and the results attached to a GitHub release. Both are
# inputs, both default to off, and everything else -- the matrix, the
# tests, the staging, the signing -- is untouched and shared.
#
# Called by ci.yml (no inputs) and by release.yml (both inputs).

name: Native build

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to put in package filenames, without a leading "v".
          Empty for CI builds, which are identified by their run instead.
        type: string
        default: ""
      release-tag:
        description: >-
          Release tag to attach the installer and portable archive to.
          Empty means build and test only, attaching nothing.
        type: string
        default: ""
      ref:
        description: >-
          Commit to build. Empty means whatever triggered the workflow,
          which is what CI wants. The release workflow passes an explicit
          SHA, because a draft release's tag does not exist in git until
          the release is published -- so the default ref for a release
          event can be a tag that cannot be checked out. Pinning a SHA
          also stops the five matrix jobs from straddling a push to
          master that lands mid-build.
        type: string
        default: ""

jobs:
  native:
    name: Native core (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # An include-only matrix, because two jobs share one runner image:
      # there is no Intel macOS runner any more, so the x86_64 slice is
      # cross-compiled on Apple silicon. `label` names the *target* and
      # is what the package is named after -- deriving it from `uname -m`
      # would say arm64 on the cross build, which is the one case where
      # the answer matters.
      #
      # ubuntu-24.04 rather than -latest: the build machine's glibc is
      # the floor for every machine the package runs on, so the oldest
      # runner that still works is the right one. 22.04 does not.
      #
      # ubuntu-24.04-arm builds the aarch64 package. Worth having for a
      # ham application specifically -- a Raspberry Pi or similar SBC at
      # the radio is a normal station, not an exotic one.
      #
      # macos-15, not macos-latest: macOS 26's SDK removed the AGL
      # framework that Qt's link interface still referenced
      # (QTBUG-137687). Building a distributed app against an older SDK
      # is what we want anyway.
      matrix:
        include:
          - { os: ubuntu-24.04,     label: linux-x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-aarch64 }
          - { os: macos-15,         label: macos-arm64 }
          - { os: macos-15,         label: macos-x86_64, osx_arch: x86_64 }
          - { os: windows-latest,   label: windows-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The package must be *installed*, not merely present: the
      # `pytest` console script does not put the working directory on
      # sys.path, so `import sstvae` fails without this. Running
      # `python -m pytest` locally hides that, which is exactly how it
      # reached CI.
      # platformdirs is the *reference* for where the config lives, and
      # the native settings test compares against it. Without it that
      # test skips -- which it did on macOS but not Windows, so the
      # check silently covered two platforms out of three. Named here
      # rather than taken from an extra because this job installs
      # `[cli]`, not `[dev]`.
      - run: pip install -e ".[cli]" pytest pybind11 platformdirs
      # Pinned to an exact tag, like onnxruntime, Hamlib and Qt. It was
      # @latest, which meant a CMake release could break a build with no
      # change on our side -- and there is no moving `v4` alias tag on
      # this action to pin to instead.
      - uses: lukka/get-cmake@v4.4.0
      # Qt, pinned like every other external dependency here
      # (onnxruntime, Hamlib). One version across all three platforms,
      # so "which Qt" never becomes a per-platform property the way
      # Ubuntu's Hamlib 4.5.5 did.
      #
      # 6.11.1, moved up from 6.8.1 on 2026-07-29. 6.8 is the LTS and
      # was the conservative choice, but the packaged app's waterfall
      # repainted slowly and looked wrong on a desktop where the *same
      # code* built against that distribution's 6.11.1 was fine -- and
      # once the missing-plugin and device-pixel-ratio faults were ruled
      # out, the Qt version was the only difference left. Matching the
      # version that demonstrably works is worth more than the LTS
      # label. Windows 10 is still supported (6.12 LTS is announced as
      # the last release that will be), so decision 2 is unaffected.
      #
      # qtmultimedia is the only extra module: Widgets, Gui and Network
      # are in the base package.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtmultimedia
          cache: true
          # The action works out `host` from the runner (it knows about
          # linux_arm64), but it only fills in `arch` for Android and
          # Windows -- every Linux host falls through to aqt's default,
          # which is the x86_64 package. So an ARM build has to name
          # Qt's arm64 desktop package itself. Empty elsewhere, which
          # leaves the existing platforms on that same default.
          arch: ${{ (runner.os == 'Linux' && runner.arch == 'ARM64') && 'linux_gcc_arm64' || '' }}
          # aqtinstall from git, pinned to the commit that supports Qt
          # 6.11 on Windows (PR #1000, issue #1007).
          #
          # Qt changed its Windows repository layout at 6.11: the
          # per-architecture directories moved, and the released
          # aqtinstall still looks for `Updates.xml` where it used to
          # be, so it reports 6.11.1 as if it did not exist. The fix has
          # been on master since 2026-03-24 and the newest release
          # (v3.3.0) is from 2025-06 -- so the pin below is strictly
          # newer than the released version in every respect, which is
          # why it is used on all three platforms rather than only on
          # the one that needs it. One installer everywhere; a
          # per-platform tool is how "which Qt you get" quietly becomes
          # a per-platform property.
          #
          # Remove this once an aqtinstall release contains the fix.
          aqtsource: "git+https://github.com/miurahr/aqtinstall@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
      # aqt's Qt is not a distro package and brings no system
      # dependencies with it; these are what its plugins dlopen at
      # startup. Without them the build succeeds and the app dies on
      # launch, which is a worse place to find out.
      - name: Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libpulse0 \
            desktop-file-utils appstream
      # `appstream` and `desktop-file-utils` above are for the AppImage's
      # metadata, not for Qt: tools/make_installer.sh validates the
      # .desktop and .metainfo.xml files when the validators are present
      # and only warns when they are not. Installed here so the check
      # actually runs rather than being skipped in the one place it would
      # catch a typo before an operator does.
      # onnxruntime is a ~9-80 MB pinned download per platform. Cached
      # on the URL's hash so a version bump busts it automatically.
      #
      # **Cache the whole FetchContent tree, never a part of it.** The
      # first version of this cached only `*-subbuild`, which holds the
      # downloaded archive *and the stamp files saying it was already
      # extracted* -- while the extracted content lives in `*-src`,
      # which was not cached. The run that populated the cache passed;
      # the next one restored "already extracted" beside an empty source
      # directory and failed on all three platforms in 40 ms. A
      # FetchContent tree is only meaningful as a unit.
      # Holds onnxruntime *and* the built Hamlib, which is why the key
      # covers both files: Hamlib is compiled from source on Linux and
      # macOS, so an uncached job pays for that every time.
      - name: Cache native dependencies
        uses: actions/cache@v6
        with:
          path: native/.deps
          key: deps-${{ matrix.label }}-${{ hashFiles('native/cmake/onnxruntime.cmake', 'native/cmake/hamlib.cmake') }}
      # The codec's parity tests compare two runtimes on the *same*
      # model file, so they need that file. Fetching it here rather than
      # inside a test keeps a network failure reported as a network
      # failure. SSTVAE_REQUIRE_CODEC below then makes a skip -- for any
      # reason, including this step silently half-working -- a failure.
      - name: Cache model artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('sstvae/checkpoint.py') }}
      - name: Fetch the published ONNX artifacts
        run: python -c "from sstvae import checkpoint; [checkpoint.resolve_onnx(p, None, 'fp16') for p in ('encoder','decoder')]"
      # Put MSVC on PATH before CMake looks for a compiler. Without
      # this, the Ninja generator finds the runner's MinGW GCC first and
      # builds a perfectly good .pyd that CPython then cannot load --
      # a MinGW extension is ABI-incompatible with an MSVC-built
      # interpreter, and the only symptom is "DLL load failed".
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # x86_64 binaries run on Apple silicon through Rosetta, which is
      # what lets the cross-built slice be *tested* rather than shipped
      # blind. Not preinstalled on the runner images.
      - name: Install Rosetta
        if: matrix.osx_arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Configure
        shell: bash
        # The pybind11 module is off for the cross build: it would be
        # built for the target while the runner's Python is native, so it
        # could not be imported and `pytest --native` is skipped below.
        env:
          OSX_ARCH: ${{ matrix.osx_arch }}
        run: |
          cmake -S native -B native/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            ${OSX_ARCH:+-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCH} \
            ${OSX_ARCH:+-DSSTVAE_BUILD_PYMODULE=OFF} \
            -DSSTVAE_BUILD_GUI=ON -DSSTVAE_BUILD_QTAUDIO=ON \
            -DSSTVAE_BUILD_OVERLAY=ON \
            -DFETCHCONTENT_BASE_DIR="$PWD/native/.deps" \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')"
      - name: Build
        run: cmake --build native/build
      # Windows only, and it runs before ctest because the loader has no
      # other voice.
      #
      # A bad import library links cleanly and produces an executable
      # that cannot start: `rig_hamlib` timed out under ctest having
      # written *nothing*, its in-process watchdog never fired, and the
      # cause was two layers below anything a test can report -- the exe
      # died at load with STATUS_DLL_NOT_FOUND before reaching main, so
      # there was no output on any stream and nothing to tell it apart
      # from a deadlock. That cost several CI rounds.
      #
      # ctest cannot distinguish those, so this does it first: run the
      # binary directly and require it to *start* and exit 0. The
      # dumpbin dump is what makes a failure immediately readable -- a
      # dependency listed as `(null)`, or libhamlib-4.dll missing from
      # the list entirely, is the malformed-import-directory signature.
      - name: Rig test starts outside ctest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "native/build/tests/test_rig_hamlib.exe"
          Write-Host "== beside the executable =="
          Get-ChildItem (Split-Path $exe) -Filter *.dll | Format-Table Name, Length
          Write-Host "== imports =="
          dumpbin /dependents $exe
          Write-Host "== running it directly, 90 s limit =="
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $exited = $p.WaitForExit(90000)
          if (-not $exited) { $p.Kill() }
          Write-Host "== stdout =="; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "== stderr =="; Get-Content err.txt -ErrorAction SilentlyContinue
          if (-not $exited) {
            throw "test_rig_hamlib did not finish in 90 s"
          }
          if ($p.ExitCode -ne 0) {
            $hex = "0x{0:X8}" -f $p.ExitCode
            throw "test_rig_hamlib exited with $($p.ExitCode) ($hex). " +
                  "0xC0000135 is STATUS_DLL_NOT_FOUND: the process could not " +
                  "start, so nothing above the loader ran."
          }
      # Proves the GUI links and *starts* on this platform, which
      # building alone does not: Qt resolves its platform plugin at run
      # time, so a missing xcb or cocoa plugin is a launch failure with a
      # clean build behind it. Offscreen, and settings-only -- the
      # transmit panel's AppState would begin a checkpoint download, and
      # a link check should not depend on the network.
      - name: The GUI starts
        # A relative directory, not runner.temp: on Windows that is
        # `D:\a\_temp`, and bash eats the backslashes as escapes, so the
        # tool was handed `D:a_temp` and correctly refused to write
        # there. The shots are also worth keeping -- step 2 uploads them.
        run: |
          mkdir -p gui-shots
          ./native/build/sstvae-gui-shot --out gui-shots
        shell: bash
      # The C++ side checked against the committed corpus.
      - name: C++ tests
        run: ctest --test-dir native/build --output-on-failure
      # --- packaging ------------------------------------------------------
      # Three stages, and the first two are both published. Staging
      # produces a tree with Qt and our pinned libraries in it, which is
      # what a tester unpacks and runs; the installer step wraps that
      # same tree in the platform's own container; signing happens
      # *between* them on macOS and again after, because notarization
      # has to see the finished container.
      - name: Stage a runnable app
        run: tools/package_app.sh native/build dist
        shell: bash
      # Before the "does it start" check below, not after. The hardened
      # runtime is the reason: it is switched on by signing, and it can
      # stop an app that ran perfectly unsigned -- library validation
      # rejecting a dylib we forgot to sign looks exactly like a crash on
      # launch. Signing first means the check exercises the app as an
      # operator will get it, rather than a configuration nobody ships.
      #
      # A no-op on Linux, and a loud no-op anywhere the secrets are not
      # visible (a fork's pull request), which keeps those runs producing
      # the unsigned installers they produced before.
      - name: Sign the app
        run: tools/sign.sh app dist
        shell: bash
        env: &signing_env
          # Windows -- Azure Trusted Signing. The tenant/client/secret
          # trio is read by DefaultAzureCredential from the environment
          # rather than passed as flags, which is why the script names
          # only the other three.
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # macOS -- Developer ID certificate and a notary app-specific
          # password. No team ID: it is read out of the certificate's own
          # subject, so it cannot drift from the key that signs.
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Same hazard as SSTVAE_REQUIRE_CODEC, same answer: the step
          # with an external prerequisite is the one that rots into
          # testing nothing. Where the secrets are known to exist -- a
          # push or a branch PR on this repository, never a fork -- an
          # unsigned artifact is a failure rather than a warning.
          SSTVAE_REQUIRE_SIGNING: ${{ github.repository == 'arodland/SSTVAE' && github.event.pull_request.head.repo.fork != true && '1' || '' }}
      # Proves the *staged* tree starts, not just the build tree. The
      # two differ in exactly the way that matters -- the build tree
      # finds Qt through the compiler's rpath and the developer's
      # environment, and the staged one has to carry everything itself.
      # A missing platform plugin only shows up here.
      - name: The packaged app runs
        shell: bash
        run: |
          case "$(uname -s)" in
            Darwin) exe=dist/SSTVAE.app/Contents/MacOS/sstvae-gui ;;
            MINGW*|MSYS*) exe=dist/sstvae/sstvae-gui.exe ;;
            *) exe=dist/sstvae/sstvae-gui ;;
          esac
          # No `timeout` on macOS, so run it in the background and check
          # it is still alive -- which is the assertion anyway: an app
          # that exits on its own has failed to start.
          QT_QPA_PLATFORM=offscreen "$exe" & pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            echo "started and stayed up"
          else
            wait "$pid"; echo "the packaged app exited on its own" >&2; exit 1
          fi
      # Name packages after what they *run on*, not the image they were
      # built on. `ubuntu-24.04` in a download name reads as a
      # requirement rather than a build detail -- the binary runs on that
      # and anything newer, because the runner is chosen for the oldest
      # glibc that still works. And a name containing `latest` changes
      # meaning underneath a published release the moment GitHub moves
      # the label.
      #
      # `version` is empty for an ordinary CI run and set for a release,
      # which is the only difference between the two: a release download
      # is `sstvae-0.2.0-macos-arm64.dmg` and a CI artifact stays
      # `sstvae-macos-arm64.dmg`. Versionless is right for CI -- the run
      # it came from is its identity, and a version in the name would be
      # the *next* release's number on every build that is not that
      # release.
      - name: Name the package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "pkg=sstvae-$VERSION-${{ matrix.label }}" >> "$GITHUB_ENV"
          else
            echo "pkg=sstvae-${{ matrix.label }}" >> "$GITHUB_ENV"
          fi
      # tar on Unix, because an artifact zip does not preserve the
      # executable bit -- which would ship a macOS .app that cannot be
      # launched and a Linux binary that cannot be run.
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar czf "${{ env.pkg }}.tar.gz" -C dist .
      # archive: false uploads the tarball as itself instead of putting
      # it inside a zip. Two rules come with it: the path must resolve to
      # exactly one file, and `name` is ignored -- the artifact is named
      # after the file, which is why the tarball above is given the name
      # we want to see on the downloads page.
      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          path: ${{ env.pkg }}.tar.gz
          archive: false
          if-no-files-found: error
      # Windows keeps the zip: it is a directory rather than one file, a
      # zip is the native shape there anyway, and there are no
      # permissions to lose. It is also the portable copy -- the
      # installer below needs administrator rights and a stick does not.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ${{ env.pkg }}-portable
          path: dist
          if-no-files-found: error
      # The platform's own container: a .dmg, an AppImage, a setup .exe.
      # Built from the *same* staged tree that was just proven to start,
      # so a packaging bug here cannot be confused with a build one.
      #
      # Not gated on a tag. An installer that is only ever built for a
      # release is one whose first exercise is the release, and this is
      # the step with three platform-specific tools in it.
      - name: Build the installer
        shell: bash
        run: tools/make_installer.sh dist "${{ env.pkg }}"
      # The second half of macOS signing, and the whole of Windows's for
      # the setup .exe. It has to be here rather than folded into the
      # step above: the notary service assesses the container a user
      # downloads, and the stapled ticket is written back into that same
      # file, so there is nothing to submit until hdiutil or makensis has
      # run. Windows is the mirror image -- the payload was signed in the
      # staged tree, and this signs the wrapper around it.
      - name: Sign the installer
        shell: bash
        run: tools/sign.sh installer "${{ env.installer }}"
        env: *signing_env
      # Each of the three is a single file, so archive: false applies
      # everywhere here and the artifact takes the file's own name --
      # which is what makes the downloads page read as a list of
      # installers rather than of zips to open first. The name comes from
      # the script, through GITHUB_ENV, so the suffix is known in exactly
      # one place.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.installer }}
          archive: false
          if-no-files-found: error
      # Also worth keeping: they are how a layout regression gets seen.
      - uses: actions/upload-artifact@v7
        with:
          name: gui-shots-${{ matrix.label }}
          path: gui-shots
          if-no-files-found: error

      # Phase 0's actual exit criterion: the *Python* suite, running
      # against the C++ implementations rather than the reference ones.
      - name: Python suite against the C++ core
        if: matrix.osx_arch == ''
        run: pytest -q --native
        env:
          # The codec parity tests are the strongest checks in the
          # suite -- same runtime, same file, so they can demand
          # *identical* output rather than a tolerance. That also makes
          # them the ones with a downloaded prerequisite, and therefore
          # the ones that could quietly become no tests at all. Here
          # they are mandatory.
          SSTVAE_REQUIRE_CODEC: "1"
      # Also covers tests/test_native_cli.py, which runs the built
      # `sstvae-decode` against sstvae_decode.py on one WAV and requires
      # the same picture byte for byte -- Phase 2's exit criterion.
      - name: Slow suite against the C++ core
        if: matrix.os == 'ubuntu-24.04'
        run: pytest -q -m slow --native
        env:
          SSTVAE_REQUIRE_CODEC: "1"

      # --- release assets -------------------------------------------------
      # Only when called with a tag; an ordinary CI run has none and skips
      # this entirely. The files are exactly the ones already proven above
      # -- the installer that was signed, and the portable archive -- so a
      # release asset cannot be a different build from the one that passed.
      #
      # `--clobber` because the release event fires on every draft save,
      # so a second run must overwrite its own assets rather than fail on
      # "asset already exists" and leave the release half-populated.
      - name: Attach to the release
        if: inputs.release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            # The portable copy is a directory on Windows, so it is
            # zipped here rather than by upload-artifact. Same tree, same
            # signatures; a release asset has to be one file.
            portable="${{ env.pkg }}-portable.zip"
            powershell -NoProfile -NonInteractive -Command \
              "Compress-Archive -Path dist/* -DestinationPath '$portable' -Force"
          else
            portable="${{ env.pkg }}.tar.gz"
          fi
          gh release upload "$TAG" \
            "${{ env.installer }}" "$portable" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached ${{ env.installer }} and $portable to $TAG"
