# CI for the Python reference and the native (C++) port.
#
# This is the project's first workflow. CLAUDE.md notes in two places
# that tests which `importorskip` "would quietly stop running instead of
# failing, and there is no CI to notice" -- so the Python job below runs
# with the dev extra installed and treats a skipped reference test as a
# problem to look at, not a pass.
#
# Qt was absent through Phases 0-2, when there was no Qt code to
# compile. It is installed on all three platforms now, and the app is
# built with SSTVAE_BUILD_GUI=ON rather than AUTO -- because AUTO is
# what let the entire GUI go uncompiled on macOS and Windows without a
# single job going red. A switch that silently builds nothing is the
# failure mode SSTVAE_REQUIRE_CODEC and the sstvae_rig target check
# already exist to prevent; the same rule applies here.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The generated artifacts are committed, so the only thing keeping
  # them honest is regenerating them and diffing. Runs first and alone:
  # if config.hpp is stale, every other job is testing the wrong thing.
  generated:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pillow
      - name: config.hpp matches sstvae/config.py
        run: python tools/gen_config_header.py --check
      - name: Golden vectors match the Python reference
        run: python tools/gen_golden_vectors.py --check
      # Encoding check only: it compares the generated C++ against
      # sstvae/modem/interleaver_perms.npy, which is the frozen on-air
      # format. It does NOT re-derive from numpy -- see
      # tools/freeze_format_constants.py for why that distinction is
      # the whole point.
      - name: Interleaver table matches the frozen data
        run: python tools/gen_interleaver_table.py --check
      - name: Layering rules
        run: python tools/check_layering.py
      # Catches on Linux what would otherwise only fail on MSVC: a
      # std:: name used without its header, which libstdc++ and libc++
      # forgive and MSVC does not.
      - name: Standard-library includes
        run: python tools/check_includes.py
      - name: Show the diff if anything is stale
        if: failure()
        run: |
          python tools/gen_config_header.py || true
          python tools/gen_golden_vectors.py || true
          git diff --stat
          git diff -- native/core/config.hpp native/tests/golden/manifest.json

  python:
    name: Python reference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Exact tag, because setup-uv publishes no moving major alias at
      # all -- there is no `v8` or `v9` to track, only point releases.
      # Held one major back from v9.0.0, which is days old; v8.3.2 is
      # already on node24, which is the whole reason for the bump.
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The dev extra pins CPU torch, which several tests use as the
      # *reference* implementation for the numpy/ONNX paths.
      - run: uv pip install --system -e ".[dev,cli]"
      - name: Fast suite
        run: pytest -q
      - name: Slow suite
        if: matrix.os == 'ubuntu-latest'
        run: pytest -q -m slow

  native:
    name: Native core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No Intel macOS runner. docs/native-app.md listed "GHA retires
        # the Intel macOS runner mid-project" as a risk; it turns out to
        # have happened already -- `macos-13` no longer schedules and a
        # job requesting it queues forever rather than failing, which is
        # worse than an error.
        #
        # Decision 2 still stands: Intel Macs are supported, because
        # hams are conservative about hardware. So the x86_64 slice has
        # to be *cross-compiled* on an Apple-silicon runner, which the
        # doc anticipated as a fallback and which is now the only path.
        # Until the packaging work in Phase 4 exists to do that, this
        # matrix tests arm64 macOS only -- an honest gap, not a decision
        # to drop Intel.
        #
        # macos-15, not macos-latest. macos-latest is now macOS 26
        # (Tahoe), whose SDK removed the AGL framework -- and Qt 6.8's
        # link interface still referenced it, so every Qt executable
        # failed with "ld: framework 'AGL' not found" (QTBUG-137687).
        # The Qt pin has since moved to 6.11.1, which may have dropped
        # that reference; the pin stays regardless, because building a
        # distributed app against an older SDK is what we want and
        # because unpinning it is a change to make on purpose rather
        # than a side effect of a version bump.
        # Qt does not use AGL; the flag is vestigial. Pinning the image
        # is the deterministic fix and costs nothing else: building a
        # distributed app against an older SDK is what you want anyway,
        # given decision 2's conservative hardware floor.
        #
        # This has a known expiry -- GHA retires runner images, and this
        # matrix already carries a comment about macos-13 disappearing.
        # The real fix is a Qt with the AGL reference removed; revisit
        # when the pin below moves.
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The package must be *installed*, not merely present: the
      # `pytest` console script does not put the working directory on
      # sys.path, so `import sstvae` fails without this. Running
      # `python -m pytest` locally hides that, which is exactly how it
      # reached CI.
      # platformdirs is a `gui`-extra dependency, but it is the
      # *reference* for where the config lives, and the native settings
      # test compares against it. Without it that test skips -- which it
      # did on macOS but not Windows, so the check silently covered two
      # platforms out of three. Installed explicitly rather than pulling
      # in the whole gui extra, which would mean 648 MB of PySide6.
      - run: pip install -e ".[cli]" pytest pybind11 platformdirs
      # Pinned to an exact tag, like onnxruntime, Hamlib and Qt. It was
      # @latest, which meant a CMake release could break a build with no
      # change on our side -- and there is no moving `v4` alias tag on
      # this action to pin to instead.
      - uses: lukka/get-cmake@v4.4.0
      # Qt, pinned like every other external dependency here
      # (onnxruntime, Hamlib). One version across all three platforms,
      # so "which Qt" never becomes a per-platform property the way
      # Ubuntu's Hamlib 4.5.5 did.
      #
      # 6.11.1, moved up from 6.8.1 on 2026-07-29. 6.8 is the LTS and
      # was the conservative choice, but the packaged app's waterfall
      # repainted slowly and looked wrong on a desktop where the *same
      # code* built against that distribution's 6.11.1 was fine -- and
      # once the missing-plugin and device-pixel-ratio faults were ruled
      # out, the Qt version was the only difference left. Matching the
      # version that demonstrably works is worth more than the LTS
      # label. Windows 10 is still supported (6.12 LTS is announced as
      # the last release that will be), so decision 2 is unaffected.
      #
      # qtmultimedia is the only extra module: Widgets, Gui and Network
      # are in the base package.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtmultimedia
          cache: true
          # aqtinstall from git, pinned to the commit that supports Qt
          # 6.11 on Windows (PR #1000, issue #1007).
          #
          # Qt changed its Windows repository layout at 6.11: the
          # per-architecture directories moved, and the released
          # aqtinstall still looks for `Updates.xml` where it used to
          # be, so it reports 6.11.1 as if it did not exist. The fix has
          # been on master since 2026-03-24 and the newest release
          # (v3.3.0) is from 2025-06 -- so the pin below is strictly
          # newer than the released version in every respect, which is
          # why it is used on all three platforms rather than only on
          # the one that needs it. One installer everywhere; a
          # per-platform tool is how "which Qt you get" quietly becomes
          # a per-platform property.
          #
          # Remove this once an aqtinstall release contains the fix.
          aqtsource: "git+https://github.com/miurahr/aqtinstall@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
      # aqt's Qt is not a distro package and brings no system
      # dependencies with it; these are what its plugins dlopen at
      # startup. Without them the build succeeds and the app dies on
      # launch, which is a worse place to find out.
      - name: Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libpulse0
      # onnxruntime is a ~9-80 MB pinned download per platform. Cached
      # on the URL's hash so a version bump busts it automatically.
      #
      # **Cache the whole FetchContent tree, never a part of it.** The
      # first version of this cached only `*-subbuild`, which holds the
      # downloaded archive *and the stamp files saying it was already
      # extracted* -- while the extracted content lives in `*-src`,
      # which was not cached. The run that populated the cache passed;
      # the next one restored "already extracted" beside an empty source
      # directory and failed on all three platforms in 40 ms. A
      # FetchContent tree is only meaningful as a unit.
      # Holds onnxruntime *and* the built Hamlib, which is why the key
      # covers both files: Hamlib is compiled from source on Linux and
      # macOS, so an uncached job pays for that every time.
      - name: Cache native dependencies
        uses: actions/cache@v6
        with:
          path: native/.deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/cmake/onnxruntime.cmake', 'native/cmake/hamlib.cmake') }}
      # The codec's parity tests compare two runtimes on the *same*
      # model file, so they need that file. Fetching it here rather than
      # inside a test keeps a network failure reported as a network
      # failure. SSTVAE_REQUIRE_CODEC below then makes a skip -- for any
      # reason, including this step silently half-working -- a failure.
      - name: Cache model artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('sstvae/checkpoint.py') }}
      - name: Fetch the published ONNX artifacts
        run: python -c "from sstvae import checkpoint; [checkpoint.resolve_onnx(p, None, 'fp16') for p in ('encoder','decoder')]"
      # Put MSVC on PATH before CMake looks for a compiler. Without
      # this, the Ninja generator finds the runner's MinGW GCC first and
      # builds a perfectly good .pyd that CPython then cannot load --
      # a MinGW extension is ABI-incompatible with an MSVC-built
      # interpreter, and the only symptom is "DLL load failed".
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        shell: bash
        run: |
          cmake -S native -B native/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSSTVAE_BUILD_GUI=ON -DSSTVAE_BUILD_QTAUDIO=ON \
            -DSSTVAE_BUILD_OVERLAY=ON \
            -DFETCHCONTENT_BASE_DIR="$PWD/native/.deps" \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')"
      - name: Build
        run: cmake --build native/build
      # Windows only, and it runs before ctest because the loader has no
      # other voice.
      #
      # A bad import library links cleanly and produces an executable
      # that cannot start: `rig_hamlib` timed out under ctest having
      # written *nothing*, its in-process watchdog never fired, and the
      # cause was two layers below anything a test can report -- the exe
      # died at load with STATUS_DLL_NOT_FOUND before reaching main, so
      # there was no output on any stream and nothing to tell it apart
      # from a deadlock. That cost several CI rounds.
      #
      # ctest cannot distinguish those, so this does it first: run the
      # binary directly and require it to *start* and exit 0. The
      # dumpbin dump is what makes a failure immediately readable -- a
      # dependency listed as `(null)`, or libhamlib-4.dll missing from
      # the list entirely, is the malformed-import-directory signature.
      - name: Rig test starts outside ctest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "native/build/tests/test_rig_hamlib.exe"
          Write-Host "== beside the executable =="
          Get-ChildItem (Split-Path $exe) -Filter *.dll | Format-Table Name, Length
          Write-Host "== imports =="
          dumpbin /dependents $exe
          Write-Host "== running it directly, 90 s limit =="
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $exited = $p.WaitForExit(90000)
          if (-not $exited) { $p.Kill() }
          Write-Host "== stdout =="; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "== stderr =="; Get-Content err.txt -ErrorAction SilentlyContinue
          if (-not $exited) {
            throw "test_rig_hamlib did not finish in 90 s"
          }
          if ($p.ExitCode -ne 0) {
            $hex = "0x{0:X8}" -f $p.ExitCode
            throw "test_rig_hamlib exited with $($p.ExitCode) ($hex). " +
                  "0xC0000135 is STATUS_DLL_NOT_FOUND: the process could not " +
                  "start, so nothing above the loader ran."
          }
      # Proves the GUI links and *starts* on this platform, which
      # building alone does not: Qt resolves its platform plugin at run
      # time, so a missing xcb or cocoa plugin is a launch failure with a
      # clean build behind it. Offscreen, and settings-only -- the
      # transmit panel's AppState would begin a checkpoint download, and
      # a link check should not depend on the network.
      - name: The GUI starts
        # A relative directory, not runner.temp: on Windows that is
        # `D:\a\_temp`, and bash eats the backslashes as escapes, so the
        # tool was handed `D:a_temp` and correctly refused to write
        # there. The shots are also worth keeping -- step 2 uploads them.
        run: |
          mkdir -p gui-shots
          ./native/build/sstvae-gui-shot --out gui-shots
        shell: bash
      # The C++ side checked against the committed corpus.
      - name: C++ tests
        run: ctest --test-dir native/build --output-on-failure
      # --- packaging ------------------------------------------------------
      # Staged with Qt and our pinned libraries, so what comes out of CI
      # is something a tester can unpack and run rather than a binary
      # that needs a Qt install to start. Not an installer: no icons, no
      # associations, no signing. Those are the next steps.
      - name: Stage a runnable app
        run: tools/package_app.sh native/build dist
        shell: bash
      # Proves the *staged* tree starts, not just the build tree. The
      # two differ in exactly the way that matters -- the build tree
      # finds Qt through the compiler's rpath and the developer's
      # environment, and the staged one has to carry everything itself.
      # A missing platform plugin only shows up here.
      - name: The packaged app runs
        shell: bash
        run: |
          case "$(uname -s)" in
            Darwin) exe=dist/sstvae-gui.app/Contents/MacOS/sstvae-gui ;;
            MINGW*|MSYS*) exe=dist/sstvae/sstvae-gui.exe ;;
            *) exe=dist/sstvae/sstvae-gui ;;
          esac
          # No `timeout` on macOS, so run it in the background and check
          # it is still alive -- which is the assertion anyway: an app
          # that exits on its own has failed to start.
          QT_QPA_PLATFORM=offscreen "$exe" & pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            echo "started and stayed up"
          else
            wait "$pid"; echo "the packaged app exited on its own" >&2; exit 1
          fi
      # tar on Unix, because an artifact zip does not preserve the
      # executable bit -- which would ship a macOS .app that cannot be
      # launched and a Linux binary that cannot be run.
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar czf "sstvae-${{ matrix.os }}.tar.gz" -C dist .
      # archive: false uploads the tarball as itself instead of putting
      # it inside a zip. Two rules come with it: the path must resolve to
      # exactly one file, and `name` is ignored -- the artifact is named
      # after the file, which is why the tarball above is given the name
      # we want to see on the downloads page.
      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          path: sstvae-${{ matrix.os }}.tar.gz
          archive: false
          if-no-files-found: error
      # Windows keeps the zip: it is a directory rather than one file, a
      # zip is the native shape there anyway, and there are no
      # permissions to lose.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: sstvae-${{ matrix.os }}
          path: dist
          if-no-files-found: error
      # Also worth keeping: they are how a layout regression gets seen.
      - uses: actions/upload-artifact@v7
        with:
          name: gui-shots-${{ matrix.os }}
          path: gui-shots
          if-no-files-found: error

      # Phase 0's actual exit criterion: the *Python* suite, running
      # against the C++ implementations rather than the reference ones.
      - name: Python suite against the C++ core
        run: pytest -q --native
        env:
          # The codec parity tests are the strongest checks in the
          # suite -- same runtime, same file, so they can demand
          # *identical* output rather than a tolerance. That also makes
          # them the ones with a downloaded prerequisite, and therefore
          # the ones that could quietly become no tests at all. Here
          # they are mandatory.
          SSTVAE_REQUIRE_CODEC: "1"
      # Also covers tests/test_native_cli.py, which runs the built
      # `sstvae-decode` against sstvae_decode.py on one WAV and requires
      # the same picture byte for byte -- Phase 2's exit criterion.
      - name: Slow suite against the C++ core
        if: matrix.os == 'ubuntu-24.04'
        run: pytest -q -m slow --native
        env:
          SSTVAE_REQUIRE_CODEC: "1"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No Python packages: with the pybind11 module off, this job
      # builds C++ and runs ctest against the committed corpus, which
      # needs nothing from the Python side.
      - uses: lukka/get-cmake@v4.4.0
      # RelWithDebInfo, not Debug. The sanitizers are not what makes an
      # instrumented build slow -- -O0 is. Measured on this suite:
      # 670 s at -O0 against 136 s at -O2, same 7 tests, and ASan still
      # reports a planted heap-buffer-overflow with a symbolized stack
      # (upstream recommends -O1/-O2 with -fno-omit-frame-pointer, which
      # SSTVAE_SANITIZE sets). At -O0 the rx engine's tests did not merely
      # run slowly, they timed out.
      - name: Configure with sanitizers
        run: |
          cmake -S native -B native/build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSSTVAE_SANITIZE=ON \
            -DSSTVAE_BUILD_PYMODULE=OFF -DSSTVAE_BUILD_CODEC=OFF \
            -DSSTVAE_BUILD_RIG=OFF
      - run: cmake --build native/build-asan
      # C++ tests only. The pybind11 module is off because running it
      # under ASan means preloading the runtime into the interpreter
      # (LD_PRELOAD) and then chasing leaks in CPython itself, which
      # says nothing about this code. "No memory safety net" is an
      # accepted cost in docs/native-app.md; this is the net.
      #
      # The codec is off for the same reason: it is a prebuilt shared
      # library nobody here compiled with instrumentation, so ASan would
      # report onnxruntime's allocations rather than ours.
      - run: ctest --test-dir native/build-asan --output-on-failure

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.0
      # A separate job from ASan because the two sanitizers cannot be
      # combined, and separate from the ordinary build because the whole
      # tree does not need instrumenting to check the part that has
      # threads in it.
      #
      # That part is small and recent: the receiver's lock-free ring
      # buffer, the decode loop, and the transmitter's PTT watchdog. All
      # three make claims about what may run concurrently -- "the audio
      # callback never blocks", "the message string is only written
      # outside the playing window" -- and those claims are exactly the
      # kind that stay true until someone adds a field.
      - name: Configure with ThreadSanitizer
        run: |
          cmake -S native -B native/build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DSSTVAE_BUILD_PYMODULE=OFF -DSSTVAE_BUILD_CODEC=OFF \
            -DSSTVAE_BUILD_RIG=OFF
      - run: cmake --build native/build-tsan --target test_rx_engine test_tx_engine test_ringbuffer
      - run: ctest --test-dir native/build-tsan --output-on-failure -R 'rx_engine|tx_engine|ringbuffer'
