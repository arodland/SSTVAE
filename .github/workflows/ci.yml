# CI for the Python reference and the native (C++) port.
#
# This is the project's first workflow. CLAUDE.md notes in two places
# that tests which `importorskip` "would quietly stop running instead of
# failing, and there is no CI to notice" -- so the Python job below runs
# with the dev extra installed and treats a skipped reference test as a
# problem to look at, not a pass.
#
# Qt was absent through Phases 0-2, when there was no Qt code to
# compile. It is installed on all three platforms now, and the app is
# built with SSTVAE_BUILD_GUI=ON rather than AUTO -- because AUTO is
# what let the entire GUI go uncompiled on macOS and Windows without a
# single job going red. A switch that silently builds nothing is the
# failure mode SSTVAE_REQUIRE_CODEC and the sstvae_rig target check
# already exist to prevent; the same rule applies here.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    # `labeled` in addition to the three defaults (opened, synchronize,
    # reopened), so that adding the `sign` label to an open pull request
    # produces a signed build without having to push an empty commit to
    # get one. It is the only way in: the label is read from the event
    # payload when the run starts, so a run already under way was
    # decided before the label existed.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # A label-triggered run is a **separate** group from the ordinary one
  # for this ref, and that is not tidiness. `cancel-in-progress` is on,
  # so sharing a group would mean labelling a pull request whose CI is
  # still running cancels it -- and the four jobs that have nothing to do
  # with signing would be left showing "cancelled" on the pull request
  # while the new run redid work that was already passing.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'main' }}
  cancel-in-progress: true

jobs:
  # The generated artifacts are committed, so the only thing keeping
  # them honest is regenerating them and diffing. Runs first and alone:
  # if config.hpp is stale, every other job is testing the wrong thing.
  generated:
    name: Generated artifacts are current
    # Shared by every job in this file. Labelling a pull request fires
    # the whole workflow, and `sign` is the only label that should mean
    # anything to CI -- without this, filing a `bug` or `docs` label
    # would rebuild five platforms and re-run two sanitizers for nothing.
    #
    # One condition for all five jobs rather than "only the native job
    # re-runs", deliberately: mixing this run's results with the previous
    # run's on one commit reads fine right up until the two disagree, and
    # the saving is a few runner-minutes on an action taken by hand a
    # handful of times per release.
    if: &label_is_relevant >-
      github.event.action != 'labeled' || github.event.label.name == 'sign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pillow
      - name: config.hpp matches sstvae/config.py
        run: python tools/gen_config_header.py --check
      - name: Golden vectors match the Python reference
        run: python tools/gen_golden_vectors.py --check
      # Encoding check only: it compares the generated C++ against
      # sstvae/modem/interleaver_perms.npy, which is the frozen on-air
      # format. It does NOT re-derive from numpy -- see
      # tools/freeze_format_constants.py for why that distinction is
      # the whole point.
      - name: Interleaver table matches the frozen data
        run: python tools/gen_interleaver_table.py --check
      - name: Layering rules
        run: python tools/check_layering.py
      # Catches on Linux what would otherwise only fail on MSVC: a
      # std:: name used without its header, which libstdc++ and libc++
      # forgive and MSVC does not.
      - name: Standard-library includes
        run: python tools/check_includes.py
      # Same shape, different expensive platform: a `--` inside an XML
      # comment is illegal, and only an Android Gradle build says so --
      # against a copy of the file under build/intermediates/, which is
      # not a path anyone can edit.
      - name: XML comments
        run: python tools/check_xml_comments.py
      # Third instance of the same pattern: a mistake only one
      # expensive platform reports. `native/`'s C++ is checked six
      # ways and its Java was checked by nobody until an APK was
      # built on a machine with an NDK -- a multi-catch whose
      # alternatives were related by subclassing is not a syntax
      # error, so no parser would have found it either. Robolectric's
      # `android-all` is a real Android API surface on Maven Central,
      # pinned and checksummed; the script skips itself rather than
      # failing if the fetch is unavailable, and a cache hit makes it
      # free.
      - name: Android Java types
        run: tools/check_android_java.sh
      - name: Show the diff if anything is stale
        if: failure()
        run: |
          python tools/gen_config_header.py || true
          python tools/gen_golden_vectors.py || true
          git diff --stat
          git diff -- native/core/config.hpp native/tests/golden/manifest.json

  python:
    name: Python reference (${{ matrix.os }})
    if: *label_is_relevant
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Cap torch's CPU dispatch below AVX-512, both ATen's own kernels
      # and oneDNN's JIT (the bf16 matmul path). The hosted runner pools
      # are heterogeneous fleets, and on 2026-09-01 a windows-latest
      # machine died with 0xc000001d (STATUS_ILLEGAL_INSTRUCTION) inside
      # the bfloat16 matmuls of muon.newton_schulz -- oneDNN picked an
      # AVX-512/AMX kernel by CPUID and the machine faulted on it; the
      # re-run passed only because it landed on a different SKU. torch
      # in this job is the *reference* implementation, so the cap costs
      # speed nobody measures and makes the kernel choice deterministic.
      # Set for all three platforms: the die roll is a property of any
      # mixed fleet, not of Windows.
      ATEN_CPU_CAPABILITY: avx2
      DNNL_MAX_CPU_ISA: AVX2
    steps:
      - uses: actions/checkout@v7
      # Exact tag, because setup-uv publishes no moving major alias at
      # all -- there is no `v8` or `v9` to track, only point releases.
      # Held one major back from v9.0.0, which is days old; v8.3.2 is
      # already on node24, which is the whole reason for the bump.
      - uses: astral-sh/setup-uv@v8.3.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The dev extra pins CPU torch, which several tests use as the
      # *reference* implementation for the numpy/ONNX paths.
      - run: uv pip install --system -e ".[dev,cli]"
      - name: Fast suite
        run: pytest -q
      - name: Slow suite
        if: matrix.os == 'ubuntu-latest'
        run: pytest -q -m slow

  # The build/test/package/sign matrix lives in its own file so the
  # release workflow can run *this* job rather than a copy of it. See
  # native-build.yml -- with no inputs it behaves exactly as it did when
  # it was written out here.
  #
  # `secrets: inherit` because the signing step needs the Apple and Azure
  # secrets, and a reusable workflow gets none by default. It is the
  # blunt form; the alternative is naming all eleven twice, which is one
  # more list to keep in step with tools/sign.sh for no gain -- the
  # called workflow is in this repository and is not a third party.
  #
  # **Signing is opt-in on a pull request, and the opt-in is the `sign`
  # label.** Every signature costs Azure quota and every macOS package
  # costs a notarization round trip, so signing each push of each branch
  # spends a finite resource on builds nobody will install. A push to
  # master and a manual dispatch still sign: those are the builds the
  # README currently sends people to, and a signing path exercised only
  # at releases is one whose first exercise is a release -- the same
  # argument the installer step makes about itself.
  native:
    if: *label_is_relevant
    uses: ./.github/workflows/native-build.yml
    with:
      sign: ${{ github.event_name != 'pull_request'
                || contains(github.event.pull_request.labels.*.name, 'sign') }}
    secrets: inherit

  sanitizers:
    name: ASan + UBSan
    if: *label_is_relevant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No Python packages: with the pybind11 module off, this job
      # builds C++ and runs ctest against the committed corpus, which
      # needs nothing from the Python side.
      - uses: lukka/get-cmake@v4.4.0
      # RelWithDebInfo, not Debug. The sanitizers are not what makes an
      # instrumented build slow -- -O0 is. Measured on this suite:
      # 670 s at -O0 against 136 s at -O2, same 7 tests, and ASan still
      # reports a planted heap-buffer-overflow with a symbolized stack
      # (upstream recommends -O1/-O2 with -fno-omit-frame-pointer, which
      # SSTVAE_SANITIZE sets). At -O0 the rx engine's tests did not merely
      # run slowly, they timed out.
      - name: Configure with sanitizers
        run: |
          cmake -S native -B native/build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSSTVAE_SANITIZE=ON \
            -DSSTVAE_BUILD_PYMODULE=OFF -DSSTVAE_BUILD_CODEC=OFF \
            -DSSTVAE_BUILD_RIG=OFF
      - run: cmake --build native/build-asan
      # C++ tests only. The pybind11 module is off because running it
      # under ASan means preloading the runtime into the interpreter
      # (LD_PRELOAD) and then chasing leaks in CPython itself, which
      # says nothing about this code. "No memory safety net" is an
      # accepted cost in docs/native-app.md; this is the net.
      #
      # The codec is off for the same reason: it is a prebuilt shared
      # library nobody here compiled with instrumentation, so ASan would
      # report onnxruntime's allocations rather than ours.
      - run: ctest --test-dir native/build-asan --output-on-failure

  tsan:
    name: ThreadSanitizer
    if: *label_is_relevant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@v4.4.0
      # A separate job from ASan because the two sanitizers cannot be
      # combined, and separate from the ordinary build because the whole
      # tree does not need instrumenting to check the part that has
      # threads in it.
      #
      # That part is small and recent: the receiver's lock-free ring
      # buffer, the decode loop, and the transmitter's PTT watchdog. All
      # three make claims about what may run concurrently -- "the audio
      # callback never blocks", "the message string is only written
      # outside the playing window" -- and those claims are exactly the
      # kind that stay true until someone adds a field.
      - name: Configure with ThreadSanitizer
        run: |
          cmake -S native -B native/build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DSSTVAE_BUILD_PYMODULE=OFF -DSSTVAE_BUILD_CODEC=OFF \
            -DSSTVAE_BUILD_RIG=OFF
      - run: cmake --build native/build-tsan --target test_rx_engine test_tx_engine test_ringbuffer
      - run: ctest --test-dir native/build-tsan --output-on-failure -R 'rx_engine|tx_engine|ringbuffer'
