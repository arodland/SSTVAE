<svg class="ce" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="Waveform CE: each latent turns the carrier's phase">
<style>
  svg.ce { --bg:#f7f8fa; --fg:#1c2230; --muted:#5d6678; --grid:#d5d9e2;
            --data:#2f6fd0; --pilot:#c2410c; --ref:#c2410c; --hi:#e8eefb; }
  @media (prefers-color-scheme: dark) {
    svg.ce { --bg:#141821; --fg:#e4e8f0; --muted:#98a1b3; --grid:#2c3343;
              --data:#7aa7f0; --pilot:#f08a4b; --ref:#f08a4b; --hi:#1f2a40; } }
  .ce text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--fg); }
  .ce .t { font-size: 17px; font-weight: 600; }
  .ce .lab { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }
  .ce .note { font-size: 12px; fill: var(--muted); }
  .ce .axis { stroke: var(--grid); stroke-width: 1; fill: none; }
  .ce .data { fill: var(--data); }
  .ce .ref { fill: var(--ref); }
  .ce .sdata { stroke: var(--data); stroke-width: 2; fill: none; }
  .ce .spilot { stroke: var(--pilot); stroke-width: 2.5; fill: none; }
  .ce .hi { fill: var(--hi); }
</style>
