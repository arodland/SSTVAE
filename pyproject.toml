[project]
name = "sstvae"
version = "0.1.0"
description = "Hybrid-digital SSTV: image transmission over HF via radio-autoencoder latents on OFDM"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Encode/decode/simulate from the command line. onnxruntime is needed
# because the encoder and decoder *are* the image codec -- only
# sstvae_simulate.py runs on the base deps alone.
cli = [
    "onnxruntime>=1.17",
    "huggingface_hub>=0.20",
]
# Live receive off a soundcard: everything in `cli`, plus PortAudio
# bindings and the waterfall/preview window.
listen = [
    "onnxruntime>=1.17",
    "huggingface_hub>=0.20",
    "sounddevice>=0.4.6",
    "matplotlib>=3.7",
]
# There is no `gui` extra any more. The desktop application is
# `native/` -- a C++/Qt program, not a Python package -- and the PySide6
# one it replaced was deleted on 2026-08-01. See docs/native-app.md.
train = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "lpips>=0.1.4",
    "datasets>=2.18",
    "trackio",
    # sstvae/nonphoto.py's chart class (training mixture + the fixed
    # non-photo validation metric in scripts/train.py).
    "matplotlib>=3.7",
    # Publish-time, for scripts/export_onnx.py. `onnx` and `onnxscript`
    # are export-only (the dynamo exporter needs onnxscript, and without
    # it the export fails with ModuleNotFoundError); `onnxruntime`
    # provides quantize_dynamic and verifies each artifact before it is
    # written. A receiving station needs onnxruntime alone.
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxconverter-common>=1.14",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    # The *reference* implementation, not a runtime dependency: a few
    # tests check the ONNX/numpy path against torch. See [tool.uv] below
    # for why it is pinned to the CPU index.
    "torch>=2.0",
    # The reference for the config-path convention the native app has to
    # match (tests/test_native_settings.py). It used to arrive with the
    # `gui` extra, which is gone; it `importorskip`s, so without it here
    # the two tests that caught the AppData\Local/Roaming bug would
    # quietly stop running.
    "platformdirs>=3.0",
]

# Nothing outside `train` needs torch at all any more. The codec runs on
# onnxruntime (see sstvae/codec.py and docs/onnx.md) — 27 MB against
# torch's 336 MB, for a model that is two convolutional passes. That
# deleted the CPU-index pins the app extras used to need, and with them
# most of the trouble this block existed to manage.
#
# Nothing outside `train` touches a GPU either, which is the older and
# still-true half of the rule: one 640x480 pass is ~30-50 ms against
# ~270 ms of NumPy DSP in the same operation, on a transmission lasting
# 32-95 s, so a receiving station has no use for the ~2.5 GB of CUDA
# runtime that plain `torch` drags in on Linux.
#
# `dev` is the one non-training extra that still takes torch, because
# several tests use it as the *reference* implementation — above all
# tests/test_latents.py, which asserts the numpy latent mapping equals
# the torch one. Those tests `importorskip`, so without torch here they
# would quietly stop running instead of failing, and there is no CI to
# notice.
#
# The `conflicts` block is load-bearing: uv resolves a single torch for
# the whole lock, so without declaring `dev` and `train` mutually
# exclusive the CPU pin silently wins for training too.
[tool.uv]
conflicts = [
    [{ extra = "dev" }, { extra = "train" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "dev" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ROCm torch wheels (RX 9070 XT / gfx1201), local dev only — explicit so
# cloud/CUDA machines resolve torch from PyPI instead. Local install:
#   uv pip install --reinstall --index-url https://download.pytorch.org/whl/rocm7.2 torch torchvision
# NOTE: `uv sync`/`uv add` will replace the ROCm build (with CPU torch if
# an app extra is selected, PyPI CUDA torch for `train`); re-run the
# install command above afterwards.
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "rocm-nightlies"
url = "https://rocm.nightlies.amd.com/v2/gfx120X-all/"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# The interleaver permutations are part of the on-air format and are
# shipped as data rather than recomputed at import -- see the note in
# sstvae/modem/framing.py. Without this the wheel imports and then fails
# at the first transmission.
"sstvae.modem" = ["*.npy"]

[tool.setuptools.packages.find]
include = ["sstvae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The listener state-machine tests synthesize whole transmissions and run
# the real decode loop over them, so they take minutes rather than the
# ~2 s the rest of the suite does. Excluded by default to keep `pytest`
# the fast check it is documented as; run them with `pytest -m slow`.
markers = [
    "slow: multi-minute end-to-end tests (run with -m slow)",
    # Needs a downloaded model artifact, so it is the one part of the
    # suite that cannot run from a clean checkout alone. `-m 'not codec'`
    # deselects it for an isolated or offline run; SSTVAE_REQUIRE_CODEC=1
    # does the opposite and turns its skips into failures.
    "codec: needs the published ONNX artifacts (deselect with -m 'not codec')",
]
addopts = "-m 'not slow'"
