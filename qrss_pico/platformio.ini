; QRSSTVAE waveform CE beacon for a Pico W / Pico 2 W driving an Si5351A.
; See README.md.

[platformio]
default_envs = picow, pico2w

[env]
; maxgerhardt's fork carries the earlephilhower core (WiFi, Pico 2 W);
; PlatformIO's own raspberrypi platform has neither. Pinned to a commit.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
board_build.core = earlephilhower
lib_deps =
    symlink://../qrss_beacon_c
    bblanchon/ArduinoJson@7.4.2
monitor_speed = 115200
build_src_flags = -Wall -Wextra
; newlib-nano leaves %f out of printf unless asked (bench, the log).
build_flags = -Wl,-u,_printf_float

[env:picow]
board = rpipicow
board_build.filesystem_size = 1m

[env:pico2w]
board = rpipico2w
board_build.filesystem_size = 3m

; Host tests of the parts with no hardware in them: `pio test -e native`.
[env:native]
platform = native
framework =
lib_deps =
    symlink://../qrss_beacon_c
build_src_filter = +<schedule.cpp> +<si5351_plan.cpp>
test_build_src = yes
build_flags = -std=c++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
